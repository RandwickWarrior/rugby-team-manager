<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0a1628; --navy-mid: #132040; --navy-light: #1e3260;
    --teal: #00c9a7; --teal-dim: #00a085;
    --red: #ff3b30; --orange: #ff9500; --green: #34c759; --blue: #007aff; --purple: #af52de;
    --white: #f5f7fa; --muted: #8a9ab8;
    --border: rgba(255,255,255,0.08); --card: rgba(255,255,255,0.04);
    --radius: 16px; --radius-sm: 10px;
  }
  html { scroll-behavior: smooth; }
  body { background: var(--navy); color: var(--white); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

  /* ── PIN Screen ── */

  .pin-badge { width:72px; height:72px; border-radius:50%; background:linear-gradient(135deg,#ff3b30,#c0392b); display:flex; align-items:center; justify-content:center; font-size:32px; margin-bottom:1.5rem; box-shadow:0 8px 32px rgba(255,59,48,0.3); }
  .pin-title { font-family:'Bebas Neue',sans-serif; font-size:2.4rem; letter-spacing:0.05em; margin-bottom:0.4rem; }
  .pin-subtitle { font-size:14px; color:var(--muted); margin-bottom:2.5rem; }
  .pin-dots { display:flex; gap:14px; margin-bottom:2rem; }
  .pin-dot { width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,0.2); transition:all 0.15s; }
  .pin-dot.filled { background:var(--teal); border-color:var(--teal); }
  .pin-dot.error { background:var(--red); border-color:var(--red); }
  .pin-pad { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:280px; width:100%; }
  .pin-btn { aspect-ratio:1; border-radius:50%; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.06); color:var(--white); font-family:'DM Sans',sans-serif; font-size:22px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s; -webkit-tap-highlight-color:transparent; }
  .pin-btn:active { background:rgba(0,201,167,0.2); border-color:var(--teal); transform:scale(0.95); }
  .pin-btn.del { font-size:18px; color:var(--muted); }
  .pin-error { font-size:13px; color:var(--red); margin-top:0.75rem; min-height:20px; text-align:center; }

  /* ── Main layout ── */
  .container { position:relative; z-index:1; max-width:600px; margin:0 auto; padding:1.5rem 1rem 5rem; display:none; }
  .menu-btn { display:inline-flex; align-items:center; gap:4px; font-size:14px; font-weight:600; color:var(--teal); background:var(--card); border:1px solid var(--border); border-radius:10px; padding:9px 16px; text-decoration:none; transition:all 0.15s; -webkit-tap-highlight-color:transparent; }
  .menu-btn:active { transform:scale(0.97); background:rgba(0,201,167,0.08); }
  .menu-btn-bottom { display:block; text-align:center; margin-top:1.75rem; }

  .header { text-align:center; margin-bottom:1.75rem; }
  .header-badge { display:inline-flex; align-items:center; justify-content:center; width:52px; height:52px; background:linear-gradient(135deg,var(--red),#c0392b); border-radius:50%; margin-bottom:0.75rem; font-size:24px; }
  .header h1 { font-family:'Bebas Neue',sans-serif; font-size:clamp(1.8rem,7vw,2.6rem); letter-spacing:0.04em; line-height:1; margin-bottom:0.3rem; }
  .header h1 span { color:var(--red); }
  .header .subtitle { font-size:13px; color:var(--muted); }
  .lock-btn { font-size:12px; color:var(--muted); background:none; border:1px solid var(--border); border-radius:20px; padding:4px 12px; cursor:pointer; margin-top:8px; }

  /* ── Tabs ── */
  .tabs { display:flex; background:rgba(255,255,255,0.04); border-radius:12px; padding:3px; gap:2px; margin-bottom:1.5rem; }
  .tab-btn { flex:1; padding:9px 4px; font-size:12px; font-weight:600; cursor:pointer; border:none; background:none; color:var(--muted); border-radius:9px; transition:all 0.15s; font-family:'DM Sans',sans-serif; }
  .tab-btn.active { background:rgba(255,59,48,0.15); color:var(--red); }

  /* ── Season summary cards ── */
  .summary-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:1.5rem; }
  .summary-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px; }
  .summary-card-label { font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  .summary-row { display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:3px 0; }
  .summary-key { color:var(--muted); }
  .summary-val { font-weight:600; }
  .pill { font-size:11px; padding:2px 8px; border-radius:6px; font-weight:700; }
  .pill-w { background:rgba(52,199,89,0.15); color:var(--green); }
  .pill-l { background:rgba(255,59,48,0.15); color:var(--red); }
  .pill-d { background:rgba(255,149,0,0.15); color:var(--orange); }

  /* ── Section label ── */
  .section-label { font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--red); font-weight:600; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .section-label::after { content:''; flex:1; height:1px; background:var(--border); }

  /* ── Player stat cards ── */
  .player-report-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px; margin-bottom:10px; transition:border-color 0.2s; }
  .player-report-card:hover { border-color:rgba(255,59,48,0.3); }
  .prc-header { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .prc-jersey { font-size:12px; font-weight:700; background:rgba(255,255,255,0.08); padding:2px 8px; border-radius:6px; min-width:32px; text-align:center; }
  .prc-name { flex:1; font-weight:600; font-size:15px; }
  .prc-group { font-size:11px; padding:2px 8px; border-radius:6px; font-weight:600; }
  .grp-fwd { background:rgba(0,122,255,0.15); color:#6eb0ff; }
  .grp-back { background:rgba(175,82,222,0.15); color:#c490f0; }
  .prc-pts { font-size:13px; font-weight:700; color:var(--teal); }

  .stat-blocks { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:8px; }
  .stat-block { background:rgba(255,255,255,0.03); border-radius:8px; padding:8px 6px; text-align:center; }
  .sb-val { font-size:20px; font-weight:700; }
  .sb-lbl { font-size:9px; color:var(--muted); margin-top:2px; letter-spacing:0.03em; }

  .prc-bars { display:flex; flex-direction:column; gap:6px; }
  .prc-bar-row { display:flex; align-items:center; gap:8px; font-size:12px; }
  .prc-bar-label { width:120px; color:var(--muted); flex-shrink:0; }
  .prc-bar-bg { flex:1; height:6px; background:rgba(255,255,255,0.06); border-radius:3px; overflow:hidden; }
  .prc-bar-fill { height:6px; border-radius:3px; transition:width 0.5s ease; }
  .prc-bar-pct { width:36px; text-align:right; font-weight:600; flex-shrink:0; }

  /* Scoring detail */
  .scoring-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
  .scoring-chip { font-size:11px; padding:3px 10px; border-radius:10px; font-weight:600; }
  .chip-try  { background:rgba(52,199,89,0.15); color:var(--green); }
  .chip-conv { background:rgba(0,122,255,0.15); color:var(--blue); }
  .chip-pen  { background:rgba(255,149,0,0.15); color:var(--orange); }
  .chip-miss { background:rgba(255,59,48,0.12); color:var(--red); }

  /* Training section */
  .training-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px; margin-bottom:1.5rem; }
  .training-player-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; }
  .tpc-name { font-weight:600; font-size:13px; margin-bottom:6px; }
  .tpc-sessions { display:flex; gap:3px; flex-wrap:wrap; margin-bottom:6px; }
  .session-dot { width:14px; height:14px; border-radius:3px; }
  .dot-yes { background:var(--green); }
  .dot-no { background:rgba(255,59,48,0.4); }
  .dot-injured { background:var(--orange); }
  .dot-unavail { background:rgba(99,99,102,0.5); }
  .dot-unknown { background:rgba(255,255,255,0.1); }
  .tpc-pct { font-size:12px; font-weight:700; }

  /* Report tables (season tab) */
  .report-table { width:100%; border-collapse:collapse; font-size:13px; background:var(--card); }
  .report-table th { background:rgba(255,255,255,0.04); padding:9px 10px; text-align:center; font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em; white-space:nowrap; }
  .report-table td { padding:9px 10px; text-align:center; border-top:1px solid var(--border); white-space:nowrap; }
  .report-table tbody tr:nth-child(odd) td { background:rgba(255,255,255,0.015); }

  /* Availability grid */
  .grid-table { width:100%; border-collapse:collapse; font-size:12px; background:var(--card); }
  .grid-table th { background:rgba(255,255,255,0.05); padding:7px 6px; text-align:center; font-size:10px; font-weight:600; color:var(--muted); white-space:nowrap; }
  .grid-table th.g-name { text-align:left; }
  .grid-table td { padding:7px 6px; text-align:center; border-top:1px solid var(--border); font-weight:700; }
  .grid-table td.g-name { text-align:left; font-weight:600; white-space:nowrap; color:var(--white); }
  .grid-table .g-grp td { background:rgba(0,201,167,0.08); text-align:left; font-size:10px; font-weight:700; color:var(--teal); text-transform:uppercase; letter-spacing:0.05em; padding:5px 8px; }

  .g-avail  { color:#f5a623; }
  .g-out    { color:#ff3b30; }
  .g-none   { color:rgba(255,255,255,0.18); }
  .grid-legend { display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--muted); margin-bottom:1rem; }
  .grid-legend span { display:flex; align-items:center; gap:5px; }
  .grid-legend b { font-size:13px; }

  /* Sort/filter bar */
  .filter-bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:1rem; align-items:center; }
  .filter-label { font-size:12px; color:var(--muted); }
  .filter-btn { font-size:12px; padding:5px 12px; border-radius:20px; border:1px solid var(--border); background:none; color:var(--muted); cursor:pointer; font-family:'DM Sans',sans-serif; transition:all 0.15s; }
  .filter-btn.active { border-color:var(--red); color:var(--red); background:rgba(255,59,48,0.08); }

  /* Sync bar */
  .sync-bar { display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px 12px; margin-bottom:1.25rem; font-size:12px; color:var(--muted); }
  .sync-dot { width:7px; height:7px; border-radius:50%; background:var(--green); flex-shrink:0; }
  .sync-btn { margin-left:auto; padding:5px 12px; border:1px solid var(--border); border-radius:8px; background:none; color:var(--muted); font-size:11px; cursor:pointer; font-family:'DM Sans',sans-serif; transition:all 0.15s; }
  .sync-btn:hover { border-color:var(--teal); color:var(--teal); }

  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1c1c1e; color:#fff; padding:10px 22px; border-radius:20px; font-size:14px; opacity:0; transition:opacity 0.25s; pointer-events:none; z-index:999; white-space:nowrap; }
  .toast.show { opacity:1; }
  .loading { text-align:center; padding:3rem; color:var(--muted); font-size:14px; }
</style>
</head>

let liveTeamSlots = {}; // { 'round|team': { slotNum: playerName } }
let trainingData  = {}; // { date: { sessionLabel, records: { player: status } } }

let lastSyncTime  = null;

function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

async function apiGet(params) {
  try {
    const qs = new URLSearchParams(params).toString();
    const r = await fetch(APPS_SCRIPT_URL+'?'+qs);
    return await r.json();
  } catch(e) { return null; }
}

// ── Load all data from sheet ──────────────────────────────────────────────────
async function loadAllData() {
  setSyncStatus('loading');
  try {
    // Load training
    const tr = await apiGet({ action:'getTraining' });
    if (tr && tr.success) trainingData = tr.sessions || {};

    // Load match stats
    const ms = await apiGet({ action:'getMatchStats' });
    if (ms && ms.success) matchStats = ms.records || [];

    // Load availability for rounds 1-8 both teams
    const teams = ['Coogee 11','Coogee Barbarians 11'];
    for (const team of teams) {
      for (let r=1; r<=8; r++) {
        const data = await apiGet({ action:'responses', round:r, team });
        if (data && data.success && Object.keys(data.responses||{}).length > 0) {
          liveResponses[`${r}|${team}`] = data.responses;
        }
        const td = await apiGet({ action:'team', round:r, team });
        if (td && td.success && Object.keys(td.slots||{}).length > 0) {
          liveTeamSlots[`${r}|${team}`] = td.slots;
        }
      }
    }

    lastSyncTime = new Date();
    setSyncStatus('ok');
    renderTab(activeTab);
  } catch(e) {
    setSyncStatus('error');
  }
}

function setSyncStatus(state) {
  const dot = document.getElementById('sync-dot');
  const label = document.getElementById('sync-label');
  if (state==='loading') { dot.style.background='#ff9500'; label.textContent='Syncing data…'; }
  else if (state==='ok') { dot.style.background='var(--green)'; label.textContent='Last synced '+lastSyncTime.toLocaleTimeString(); }
  else { dot.style.background='var(--red)'; label.textContent='Sync failed — showing cached data'; }
}

document.getElementById('sync-btn').addEventListener('click', () => { loadAllData(); showToast('Refreshing…'); });

document.getElementById('backfill-btn').addEventListener('click', async () => {
  const btn = document.getElementById('backfill-btn');
  if (!confirm('Re-sync training data from the source spreadsheet?\n\nThis will replace all backfilled training rows with the latest data from the Rugby Team Manager spreadsheet.')) return;
  btn.textContent = '⏳ Running…';
  btn.disabled = true;
  setSyncStatus('loading');
  document.getElementById('sync-label').textContent = 'Re-backfilling training data… this may take up to 2 minutes';
  try {
    // Fire and forget — Apps Script will complete even if fetch times out
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 110000);
    try {
      const res = await fetch(APPS_SCRIPT_URL + '?action=backfillTraining&mode=write', { signal: controller.signal });
      clearTimeout(timeout);
      const data = await res.json();
      if (data.success) {
        showToast(`✅ Backfill complete — ${data.rowsAdded} rows written`);
      } else {
        showToast('⚠️ Backfill returned: ' + (data.error || 'unknown error'));
      }
    } catch(fetchErr) {
      clearTimeout(timeout);
      // Timeout is expected — Apps Script completes server-side
      showToast('⏳ Backfill running on server — refresh in 30s to see results');
    }
  } catch(e) {
    showToast('Error: ' + e.message);
  }
  btn.textContent = '⬇ Re-backfill';
  btn.disabled = false;
  setTimeout(() => loadAllData(), 5000); // auto-refresh after 5s
});

// ── Stats calculation helpers ─────────────────────────────────────────────────

// Derive a player's status for a round from sheet data
function deriveStatus(playerName, slots, responses) {
  if (slots) {
    const inStart = Object.entries(slots).some(([n,p]) => +n<=12 && p===playerName);
    if (inStart) return 'Started';
    const inBench = Object.entries(slots).some(([n,p]) => +n>12 && p===playerName);
    if (inBench) return 'Sub';
  }
  const resp = (responses||{})[playerName];
  if (resp) {
    if (resp.availability==='Yes, count me in') return 'Not Selected';
    if (resp.availability==="Sorry, can't make it") return 'Unavailable';
  }
  return '';
}

function calcPlayerStats(player) {
  // ── Games played — derived from live sheet data (all rounds) ─────────────
  let friStarted=0, friSub=0, friPlayed=0, friOut=0, friNS=0, friAvail=0;
  let sunStarted=0, sunSub=0, sunPlayed=0, sunOut=0, sunNS=0, sunAvail=0;

  // Collect all rounds that have any data in the sheet
  const friRounds = new Set([
    ...Object.keys(liveTeamSlots).filter(k=>k.endsWith('|Coogee 11')).map(k=>+k.split('|')[0]),
    ...Object.keys(liveResponses).filter(k=>k.endsWith('|Coogee 11')).map(k=>+k.split('|')[0])
  ]);
  const sunRounds = new Set([
    ...Object.keys(liveTeamSlots).filter(k=>k.endsWith('|Coogee Barbarians 11')).map(k=>+k.split('|')[0]),
    ...Object.keys(liveResponses).filter(k=>k.endsWith('|Coogee Barbarians 11')).map(k=>+k.split('|')[0])
  ]);

  friRounds.forEach(r => {
    const slots     = liveTeamSlots[`${r}|Coogee 11`];
    const responses = liveResponses[`${r}|Coogee 11`];
    const washout   = FRI_WASHOUT.includes(r);
    const status    = deriveStatus(player.name, slots, responses);
    if (!status) return;
    if (status==='Started') { if(!washout){friStarted++;friPlayed++;} friAvail++; }
    else if (status==='Sub') { if(!washout){friSub++;friPlayed++;} friAvail++; }
    else if (status==='Not Selected') { friNS++; friAvail++; }
    else if (status==='Unavailable')  { friOut++; }
  });

  sunRounds.forEach(r => {
    const slots     = liveTeamSlots[`${r}|Coogee Barbarians 11`];
    const responses = liveResponses[`${r}|Coogee Barbarians 11`];
    const washout   = SUN_WASHOUT.includes(r);
    const status    = deriveStatus(player.name, slots, responses);
    if (!status) return;
    if (status==='Started') { if(!washout){sunStarted++;sunPlayed++;} sunAvail++; }
    else if (status==='Sub') { if(!washout){sunSub++;sunPlayed++;} sunAvail++; }
    else if (status==='Not Selected') { sunNS++; sunAvail++; }
    else if (status==='Unavailable')  { sunOut++; }
  });

  const friPct      = FRI_ROUNDS > 0 ? Math.round(friPlayed/FRI_ROUNDS*100) : 0;
  const sunPct      = SUN_ROUNDS > 0 ? Math.round(sunPlayed/SUN_ROUNDS*100) : 0;
  const friAvailPct = friAvail > 0 ? Math.round(friPlayed/friAvail*100) : null;
  const sunAvailPct = sunAvail > 0 ? Math.round(sunPlayed/sunAvail*100) : null;

  // ── Training ──────────────────────────────────────────────────────────────
  const sheetDates = Object.keys(trainingData).sort();
  const hasSheetTr = sheetDates.some(d => trainingData[d]?.records?.[player.name] !== undefined);
  let trAttended, trTotal;
  if (hasSheetTr) {
    trTotal    = sheetDates.filter(d => { const v=trainingData[d]?.records?.[player.name]; return v&&v!==''; }).length;
    trAttended = sheetDates.filter(d => trainingData[d]?.records?.[player.name]==='yes').length;
  } else {
    const tr   = player.tr || [];
    trTotal    = tr.filter(v=>v!=='').length;
    trAttended = tr.filter(v=>v==='Yes').length;
  }
  const trPct = trTotal > 0 ? Math.round(trAttended/trTotal*100) : null;

  // ── Scoring ───────────────────────────────────────────────────────────────
  const pStats   = matchStats.filter(r => r.player === player.name);
  const tries    = pStats.reduce((s,r)=>s+(+r.tries||0),0);
  const convMade = pStats.reduce((s,r)=>s+(+r.convMade||0),0);
  const convMissed= pStats.reduce((s,r)=>s+(+r.convMissed||0),0);
  const penalties= pStats.reduce((s,r)=>s+(+r.penalties||0),0);
  const points   = tries*5 + convMade*2 + penalties*3;

  return { friPlayed, friOut, friNS, friAvail, friPct, friAvailPct,
           sunPlayed, sunOut, sunNS, sunAvail, sunPct, sunAvailPct,
           trAttended, trTotal, trPct,
           tries, convMade, convMissed, penalties, points };
}

function pctColor(pct) {
  if (pct === null) return 'var(--muted)';
  if (pct >= 75) return 'var(--green)';
  if (pct >= 50) return 'var(--orange)';
  return 'var(--red)';
}

function barColor(pct) {
  if (pct === null || pct === 0) return 'rgba(255,255,255,0.15)';
  if (pct >= 75) return 'var(--green)';
  if (pct >= 50) return 'var(--orange)';
  return 'var(--red)';
}

// ── Training tab ──────────────────────────────────────────────────────────────
function buildTrainingTab() {
  const sessionDates = Object.keys(trainingData).sort();
  const usingSheet   = sessionDates.length > 0;

  const playerCards = SQUAD.map(p => {
    const hasSheetData = usingSheet && sessionDates.some(d => trainingData[d]?.records?.[p.name] !== undefined);
    let dots = '', total = 0, attended = 0;

    if (hasSheetData) {
      // Sheet data is source of truth — one dot per session
      dots = sessionDates.map(d => {
        const v = trainingData[d]?.records?.[p.name];
        if (v === 'yes')     { total++; attended++; return `<div class="session-dot dot-yes" title="${d}: Attended"></div>`; }
        if (v === 'no')      { total++; return `<div class="session-dot dot-no" title="${d}: Absent"></div>`; }
        if (v === 'injured') { total++; return `<div class="session-dot dot-injured" title="${d}: Injured"></div>`; }
        if (v === 'unavail') { total++; return `<div class="session-dot dot-unavail" title="${d}: Unavailable"></div>`; }
        return `<div class="session-dot dot-unknown" title="${d}: No data"></div>`;
      }).join('');
    } else {
      // Fallback: static tr[] data (players not in training sheet)
      const hist = p.tr || [];
      total    = hist.filter(v=>v!=='').length;
      attended = hist.filter(v=>v==='Yes').length;
      dots = hist.map((v,i) => {
        const lbl = TRAINING_SESSIONS[i] || `Session ${i+1}`;
        if (v==='Yes') return `<div class="session-dot dot-yes" title="${lbl}"></div>`;
        if (v==='No')  return `<div class="session-dot dot-no" title="${lbl}"></div>`;
        return `<div class="session-dot dot-unknown" title="${lbl}: No data"></div>`;
      }).join('');
    }

    const pct = total > 0 ? Math.round(attended/total*100) : null;
    return `
      <div class="training-player-card">
        <div class="tpc-name">${p.name}</div>
        <div class="tpc-sessions">${dots}</div>
        <div class="tpc-pct" style="color:${pctColor(pct)}">${attended}/${total} sessions ${pct!==null?'('+pct+'%)':''}
        </div>
      </div>`;
  }).join('');

  const sessionCount = usingSheet ? sessionDates.length : TRAINING_SESSIONS.length;
  const legend = `
    <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:1rem;">
      <span style="display:flex;align-items:center;gap:4px"><div class="session-dot dot-yes" style="width:10px;height:10px;border-radius:2px"></div>Attended</span>
      <span style="display:flex;align-items:center;gap:4px"><div class="session-dot dot-no" style="width:10px;height:10px;border-radius:2px"></div>Absent</span>
      <span style="display:flex;align-items:center;gap:4px"><div class="session-dot dot-injured" style="width:10px;height:10px;border-radius:2px"></div>Injured</span>
      <span style="display:flex;align-items:center;gap:4px"><div class="session-dot dot-unavail" style="width:10px;height:10px;border-radius:2px"></div>Unavailable</span>
    </div>`;

  return `<div class="section-label">Training attendance — ${sessionCount} sessions tracked</div>
    ${legend}
    <div class="training-grid">${playerCards}</div>`;
}

  function resultPill(r) {

    return `<span class="pill ${cls}">${r}</span>`;

  // ── Top 10 scorers ──────────────────────────────────────────────────────
  const topScorers = Object.entries(scorerMap)

  const scorersSection = topScorers.length ? `

            <td>${s.convMade||'·'}</td>
            <td>${s.penalties||'·'}</td>
            <td style="color:var(--teal);font-weight:700">${s.points}</td>
          </tr>`).join('')}
      </tbody>
    </table>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:6px">T = tries · C = conversions · P = penalties · Pts = total points</div>
    ` : '';

  // ── Kickers ─────────────────────────────────────────────────────────────
  const kickers = Object.entries(scorerMap)
    .filter(([,s]) => s.convMade+s.convMissed+s.penalties > 0)
    .map(([name,s]) => {
      const convAtt = s.convMade + s.convMissed;
      const convPct = convAtt > 0 ? Math.round(s.convMade/convAtt*100) : null;
      const kickPts = s.convMade*2 + s.penalties*3;
      return { name, convMade:s.convMade, convAtt, convPct, penalties:s.penalties, kickPts };
    })
    .sort((a,b)=> b.kickPts-a.kickPts);

  const kickersSection = kickers.length ? `
    <div class="section-label" style="margin-top:1.5rem">Kickers</div>
    <div style="overflow-x:auto;border-radius:12px;border:1px solid var(--border)">
    <table class="report-table">
      <thead><tr>
        <th style="text-align:left">Player</th>
        <th>Conv</th><th>Pen</th><th>Att</th><th>%</th><th>Pts</th>
      </tr></thead>
      <tbody>
        ${kickers.map(k=>{
          const pctColor = k.convPct===null?'var(--muted)':k.convPct>=75?'var(--green)':k.convPct>=50?'var(--orange)':'var(--red)';
          return `
          <tr>
            <td style="text-align:left;font-weight:600">${k.name}</td>
            <td>${k.convMade}</td>
            <td>${k.penalties||'·'}</td>
            <td>${k.convAtt}</td>
            <td style="color:${pctColor};font-weight:600">${k.convPct!==null?k.convPct+'%':'—'}</td>
            <td style="color:var(--teal);font-weight:700">${k.kickPts}</td>
          </tr>`;}).join('')}
      </tbody>
    </table>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:6px">Conv = conversions made · Att = conversion attempts · % = conversion success · Pts = kicking points (conv×2 + pen×3)</div>
    ` : '';

  const scoringSection = scorersSection + kickersSection;

  return `
    <div class="section-label">Coogee 11 — Friday nights</div>
    <div class="summary-card" style="margin-bottom:1rem">${fixtureRows(friFixtures)}</div>
    <div class="section-label">Coogee Barbarians 11 — Sunday mornings</div>
    <div class="summary-card" style="margin-bottom:1rem">${fixtureRows(sunFixtures)}</div>
    ${scoringSection}`;
}

// ── Grid tab — played / available / not available, by round ──────────────────
function buildGridTab() {
  // Rounds that have occurred (played or washout) per team
  const FRI_FIX = [
    {r:1,res:'L 41–12'},{r:2,res:'W 36–12'},{r:3,res:'L 36–12'},
    {r:4,res:'W 31–19'},{r:5,res:'L 36–12'},{r:6,res:'Washout'}
  ];
  const SUN_FIX = [
    {r:1,res:'W 26–5'},{r:2,res:'L 14–29'},{r:3,res:'D 26–26'},
    {r:4,res:'W 36–7'},{r:5,res:'W 43–5'},{r:6,res:'Washout'}
  ];

  // Map a player's round status to a coloured cell
  function statusCell(status, washout) {
    if (status==='Started' || status==='Sub') {
      return washout
        ? { t:'A', cls:'g-avail',  title:'Selected — washout (no game)' }
        : { t:'✓', cls:'g-played', title:'Played' };
    }
    if (status==='Not Selected') return { t:'A', cls:'g-avail', title:'Available, not selected' };
    if (status==='Unavailable')  return { t:'✗', cls:'g-out',   title:'Not available' };
    return { t:'·', cls:'g-none', title:'No response' };
  }

  function teamTable(label, teamName, fixtures) {
    function rowsFor(group) {
      return SQUAD.filter(p => p.group === group)
        .sort((a,b) => a.name.localeCompare(b.name))
        .map(p => {
          const cells = fixtures.map(f => {
            const slots = liveTeamSlots[`${f.r}|${teamName}`];
            const resp  = liveResponses[`${f.r}|${teamName}`];
            return { status: deriveStatus(p.name, slots, resp), wo: f.res === 'Washout' };
          });
          if (!cells.some(c => c.status !== '')) return ''; // no data for this player/team
          const tds = cells.map(c => {
            const cell = statusCell(c.status, c.wo);
            return `<td class="${cell.cls}" title="${cell.title}">${cell.t}</td>`;
          }).join('');
          return `<tr><td class="g-name">${p.name}</td>${tds}</tr>`;
        }).filter(Boolean).join('');
    }
    const headers = fixtures.map(f =>
      `<th title="${f.res}">R${f.r}${f.res==='Washout'?'*':''}</th>`).join('');
    const fwd = rowsFor('Forward'), back = rowsFor('Back');
    return `
      <div class="section-label">${label}</div>
      <div style="overflow-x:auto;border-radius:12px;border:1px solid var(--border);margin-bottom:1.5rem">
      <table class="grid-table">
        <thead><tr><th class="g-name">Player</th>${headers}</tr></thead>
        <tbody>
          ${fwd ? `<tr class="g-grp"><td colspan="${fixtures.length+1}">Forwards</td></tr>${fwd}` : ''}
          ${back ? `<tr class="g-grp"><td colspan="${fixtures.length+1}">Backs</td></tr>${back}` : ''}
        </tbody>
      </table>
      </div>`;
  }

  const legend = `
    <div class="grid-legend">
      <span><b class="g-played">✓</b> Played</span>
      <span><b class="g-avail">A</b> Available, didn't play</span>
      <span><b class="g-out">✗</b> Not available</span>
      <span><b class="g-none">·</b> No response</span>
      <span>R6* = washout</span>
    </div>`;

  return `<div class="section-label">Availability &amp; selection grid</div>
    ${legend}
    ${teamTable('Coogee 11 — Friday', 'Coogee 11', FRI_FIX)}
    ${teamTable('Coogee Barbarians 11 — Sunday', 'Coogee Barbarians 11', SUN_FIX)}`;
}

function attachTabEvents() {
  document.querySelectorAll('.filter-btn[data-sort]').forEach(btn => {
    btn.addEventListener('click', () => {
      sortBy = btn.dataset.sort;
      renderTab('players');
    });
  });
}
</script>
</body>
</html>
