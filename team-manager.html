<script>
// PIN gate
(function() {
  const PIN = '0000';
  const SESSION_KEY = 'tm_pin_ok';
  if (sessionStorage.getItem(SESSION_KEY) === '1') {
    document.getElementById('tm-pin-screen').style.display = 'none';
    document.getElementById('tm-app').style.display = '';
    return;
  }
  let entry = '';
  const dots = [0,1,2,3].map(i => document.getElementById('pd'+i));
  function updateDots() {
    dots.forEach((d,i) => { d.classList.toggle('filled', i < entry.length); d.classList.remove('error'); });
    document.getElementById('tm-pin-err').textContent = '';
  }
  function tryPin() {
    if (entry === PIN) {
      sessionStorage.setItem(SESSION_KEY, '1');
      document.getElementById('tm-pin-screen').style.display = 'none';
      document.getElementById('tm-app').style.display = '';
    } else {
      dots.forEach(d => d.classList.add('error'));
      document.getElementById('tm-pin-err').textContent = 'Incorrect PIN';
      entry = '';
      setTimeout(updateDots, 700);
    }
  }
  document.querySelectorAll('.pin-btn2[data-pn]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (entry.length < 4) { entry += btn.dataset.pn; updateDots(); }
      if (entry.length === 4) setTimeout(tryPin, 80);
    });
  });
  document.getElementById('tm-pin-del').addEventListener('click', () => {
    entry = entry.slice(0,-1); updateDots();
  });
})();
</script>

// Front row positions — ONLY players who specifically play these can fill them
const FRONT_ROW = ['Loosehead Prop','Tight Head Prop','Hooker'];
// Rugby Xplorer uses "Lose Head Prop" in the entry form (misspelling kept for export only)
// Internally and in UI we use "Loosehead Prop"

// Interchangeable position groups (any position in a group can cover any other)
function getInterchangeable(grade) {
  const base = [
    ['Left Wing','Right Wing'],
    ['Left Lock','Right Lock'],
    ['Left Centre','Right Centre'],
  ];
  // U10 and U11: Number Eight is also interchangeable with both locks
  if(grade === 'u10' || grade === 'u11') {
    base.push(['Left Lock','Right Lock','Number Eight']);
  }
  return base;
}

// Returns all positions a player can play given their spreadsheet categories + interchangeable rules
function resolvePositions(categories, grade) {
  const pm = AGE_GRADES[grade].posMap;
  // Collect all mapped Xplorer positions from this player's categories
  let resolved = [];
  for(const cat of categories) {
    for(const pos of (pm[cat]||[])) {
      if(!resolved.includes(pos)) resolved.push(pos);
    }
  }

  // Apply interchangeable rules — if player can play any position in a group, add the whole group
  const interchangeable = getInterchangeable(grade);
  let added = true;
  while(added) {
    added = false;
    for(const group of interchangeable) {
      if(group.some(p=>resolved.includes(p))) {
        for(const p of group) {
          if(!resolved.includes(p)) { resolved.push(p); added=true; }
        }
      }
    }
  }

  // Front row restriction: remove front row positions unless the player explicitly plays them
  const playerFrontRow = categories.some(c => c==='Front Row - Prop' || c==='Front Row - Hooker');
  if(!playerFrontRow) {
    resolved = resolved.filter(p => !FRONT_ROW.includes(p));
  }

  return resolved;
}

// Coogee 11 (seahorses) players are eligible for Barbarians but not vice versa.
// We tag each player with their "home" team from the squad data.
// All players in rawSquad are part of Coogee 11 (seahorses).
// Barbarians-only players would have seahorses:false — none currently.
function isEligible(player, team) {
  if(team === 'seahorses') return !player.friIneligible && player.friEligible !== 'No';
  return player.sunEligible !== 'No'; // No = explicitly cannot play Sundays
}

function buildSquad(grade) {
  return rawSquad.map(p=>{
    const cats = [p.p1, p.p2, p.p3].filter(x=>x&&x!=='No Preference'&&x!=='0'&&x!=='skipped');
    const prefCats = [p.p1].filter(x=>x&&x!=='No Preference'&&x!=='0'&&x!=='skipped');
    const allPositions = resolvePositions(cats, grade);
    const prefPositions = resolvePositions(prefCats, grade);
    const altPositions = allPositions.filter(pos=>!prefPositions.includes(pos));
    return {
      ...p,
      prefXplorer: prefPositions,
      altXplorer:  altPositions,
      allXplorer:  allPositions,
      alts: [p.p2].filter(x=>x&&x!=='No Preference'&&x!=='No preference'&&x!=='0'&&x!=='skipped'&&x!=='')
    };
  });
}

function squadForTeam(grade, team) {
  return buildSquad(grade).filter(p=>!p.hidden && isEligible(p, team));
}

// Fetch responses from Sheet and merge into current team's pollResults
// Sheet responses are the source of truth — replace entire pollResults
async function syncResponsesFromSheet() {
  const t = td();
  const teamLabel = TEAMS[state.team].label;
  const data = await apiGet({ action: 'responses', round: t.round, team: teamLabel });
  if (!data || !data.responses) return false;

  // Build fresh results from sheet — only players who actually responded appear
  const newResults = {};
  for (const [player, info] of Object.entries(data.responses)) {
    newResults[player] = info.availability;
  }

  // Replace entirely so stale entries from previous rounds are removed
  const changed = JSON.stringify(t.pollResults) !== JSON.stringify(newResults);
  if (changed) {
    t.pollResults = newResults;
    storageSave();
  }
  return changed;
}

async function saveTeamToSheet() {
  const t = td();
  await apiPost({
    action: 'saveTeam',
    round: t.round,
    team: TEAMS[state.team].label,
    grade: t.grade,
    slots: t.teamSlots
  });
}

// Load team slots from Sheet (merge with local — Sheet wins)
async function loadTeamFromSheet() {
  const t = td();
  const data = await apiGet({
    action: 'team',
    round: t.round,
    team: TEAMS[state.team].label
  });
  if (!data || !data.slots || Object.keys(data.slots).length === 0) return false;
  // Convert string keys from JSON back to numbers
  const slots = {};
  for (const [k, v] of Object.entries(data.slots)) { slots[+k] = v; }
  t.teamSlots = slots;
  storageSave();
  return true;
}

// Auto-detect next upcoming round for a team based on today's date
function nextRoundForTeam(team) {
  const today = new Date(); today.setHours(0,0,0,0);
  const upcoming = (FIXTURES[team]||[])
    .filter(f => new Date(f.isoDate) >= today)
    .sort((a,b) => new Date(a.isoDate) - new Date(b.isoDate));
  return upcoming[0] ? upcoming[0].round : null;
}

function emptyData(team) {
  // Auto-detect next upcoming round from today's date
  const defaultRound = nextRoundForTeam(team) || (team === 'seahorses' ? 5 : 4);
  const fixture = (FIXTURES[team]||[]).find(f=>f.round===defaultRound);
  return {
    grade:'u11',
    round: defaultRound,
    match: fixture ? {opponent:fixture.opponent, date:fixture.date, venue:fixture.venue, time:fixture.time} : {opponent:'',date:'',venue:'',time:''},
    pollResults:{},
    teamSlots:{}
  };
}

function histDot(val, pos) {
  if(!val) return '<span style="color:#d1d1d6;font-size:15px">·</span>';
  // Normalise friS-style values ('Started', 'Unavailable', 'Not Selected')
  const v = val==='Started'?'In' : val==='Unavailable'?'Out' : val==='Not Selected'?'NS' : val==='N/A'?null : val;
  if(v===null) return ''; // N/A — skip
  const map = {
    'In':    '<span style="color:#34c759;font-size:17px;line-height:1" title="Played">●</span>',
    'Sub':   '<span style="color:#34c759;font-size:17px;line-height:1" title="Played (sub)">●</span>',
    'Out':   '<span style="color:#ff9500;font-size:14px;font-weight:700;line-height:1" title="Unavailable">U</span>',
    'NS':    '<span style="color:#aeaeb2;font-size:11px;font-weight:700;line-height:1" title="Not selected">NS</span>',
    'N.R.':  '<span style="color:#c7c7cc;font-size:15px;line-height:1" title="No response">?</span>',
    'x':     '<span style="color:#c7c7cc;font-size:15px;line-height:1" title="No response">?</span>',
    'Played':'<span style="color:#34c759;font-size:17px;line-height:1" title="Played">●</span>',
  };
  const dot = map[v] || `<span style="color:#aeaeb2;font-size:15px">${v}</span>`;
  if(pos && (val==='In'||val==='Sub'||val==='Played'||val==='Started')) {
    return `<span title="${pos}">${dot}</span>`;
  }
  return dot;
}

// Build per-player status map for a round from sheet data
function buildRoundStatus(slots, responses) {
  const starters = new Set(), bench = new Set();
  if(slots) Object.entries(slots).forEach(([num,name])=>{
    if(!name) return;
    if(+num<=12) starters.add(name); else bench.add(name);
  });
  const result = {};
  rawSquad.forEach(p=>{
    if(starters.has(p.name))      result[p.name]='Started';
    else if(bench.has(p.name))    result[p.name]='Sub';
    else if(responses?.[p.name]){
      const a=responses[p.name].availability;
      result[p.name]= a==='Yes, count me in' ? 'Not Selected'
                    : a==="Sorry, can't make it" ? 'Unavailable' : 'N.R.';
    } else result[p.name]='';
  });
  return result;
}

async function loadSquadHistory() {
  if(squadHistoryLoaded||squadHistoryLoading) return;
  squadHistoryLoading=true;
  // Fetch all past rounds beyond static data (round > 4), excluding washouts
  const today = new Date(); today.setHours(0,0,0,0);
  const friFutures = FIXTURES.seahorses.filter(f=>f.round>4 && new Date(f.isoDate)<=today && f.result!=='Washout');
  const sunFutures = FIXTURES.barbarians.filter(f=>f.round>4 && new Date(f.isoDate)<=today && f.result!=='Washout');
  await Promise.all([
    ...friFutures.map(async f=>{
      const [t,r]=await Promise.all([
        apiGet({action:'team',round:f.round,team:'Coogee 11'}),
        apiGet({action:'responses',round:f.round,team:'Coogee 11'})
      ]);
      liveSquadHistory.fri[f.round]=buildRoundStatus(t?.slots,r?.responses);
    }),
    ...sunFutures.map(async f=>{
      const [t,r]=await Promise.all([
        apiGet({action:'team',round:f.round,team:'Coogee Barbarians 11'}),
        apiGet({action:'responses',round:f.round,team:'Coogee Barbarians 11'})
      ]);
      liveSquadHistory.sun[f.round]=buildRoundStatus(t?.slots,r?.responses);
    })
  ]);
  squadHistoryLoaded=true; squadHistoryLoading=false;
  if(state.section==='squad'&&state.tab==='squad') render();
}

async function loadTrainingData() {
  if(trainingDataLoaded||trainingDataLoading) return;
  trainingDataLoading=true;
  const data = await apiGet({ action:'getTraining' });
  if(data?.success) liveTrainingData = data.sessions || {};
  trainingDataLoaded=true; trainingDataLoading=false;
  if(state.section==='squad'&&state.tab==='stats') render();
}

function buildSquad2(){
  const sq=squad(); const g=AGE_GRADES[td().grade];

  // Kick off lazy load for rounds beyond static data
  if(!squadHistoryLoaded&&!squadHistoryLoading) loadSquadHistory();

  const friFix=FIXTURES.seahorses;
  const sunFix=FIXTURES.barbarians;

  function roundDot(player, round, team) {
    const idx=round-1; // 0-indexed into static arrays
    const histS = team==='fri'?(player.friS||[]):(player.sunS||[]);
    const histP = team==='fri'?(player.friPos||[]):(player.sunPos||[]);
    const fix   = team==='fri'?friFix.find(f=>f.round===round):sunFix.find(f=>f.round===round);

    // Washout — always show rain symbol regardless of data source
    if(fix?.result === 'Washout') return `<span style="color:#a0aec0;font-size:14px;line-height:1" title="R${round}: Washout">~</span>`;

    if(idx<histS.length) {
      // Static data (rounds 1–4)
      const val=histS[idx]; const pos=histP[idx];
      if(!val) return `<span style="color:#d1d1d6;font-size:15px" title="R${round}">·</span>`;
      return histDot(val, pos?`${pos} · R${round}`:`R${round}`);
    }
    // Live data (rounds 5+)
    const live = team==='fri'?liveSquadHistory.fri[round]:liveSquadHistory.sun[round];
    if(live) {
      const val=live[player.name]||'';
      if(!val) return `<span style="color:#d1d1d6;font-size:15px" title="R${round}">·</span>`;
      return histDot(val, `R${round}`);
    }
    // Round date has passed — data still loading
    const today2 = new Date(); today2.setHours(0,0,0,0);
    if(fix && new Date(fix.isoDate) <= today2) return `<span style="color:#d1d1d6;font-size:11px" title="R${round}: loading…">…</span>`;
    return ''; // future round — no dot
  }

  return `
    <div class="notice">${TEAMS[state.team].label} · ${g.label}: ${g.starters.length} starters + ${g.subCount} subs. Both teams share this squad.<br>
      <span style="color:#ff9500;font-size:12px">⚠️ Theo Deichsel #23, Kai Lianto #1. Cade Forshaw/Oliver Worley are Sunday only. Xavier Saunders unregistered.</span>
      ${squadHistoryLoading?'<br><span style="color:#007aff;font-size:12px">Loading round history…</span>':''}
    </div>
    <div style="display:flex;gap:10px;font-size:12px;color:#8e8e93;padding:0 4px;margin-bottom:8px;flex-wrap:wrap;align-items:center">
      <span>${histDot('In')} Played</span>
      <span><span style="color:#ff9500;font-size:14px;font-weight:700">U</span> Unavailable</span>
      <span><span style="color:#aeaeb2;font-size:11px;font-weight:700">NS</span> Not selected</span>
      <span>${histDot('N.R.')} No response</span>
      <span><span style="color:#a0aec0;font-size:14px">~</span> Washout</span>
    </div>
    <div class="section-label">Squad — ${sq.length} players · All rounds (R1 → latest)</div>
    ${sq.map(p=>{
      const friDots=friFix.map(f=>roundDot(p,f.round,'fri')).join('');
      const sunDots=sunFix.map(f=>roundDot(p,f.round,'sun')).join('');
      const posPills=`<span class="pill-pos" style="font-size:11px;padding:2px 7px">${p.p1}</span>${p.alts.map(a=>`<span class="pill-pos" style="opacity:0.6;font-size:11px;padding:2px 7px">${a}</span>`).join('')}`;
      return `
      <div class="card" style="padding:10px 14px">
        <div style="display:flex;align-items:flex-start;gap:8px">
          <div style="flex:1;min-width:0">
            <div class="row" style="margin-bottom:5px">
              <span class="badge-num badge">#${p.jersey??'—'}</span>
              <span class="player-name">${p.name}</span>
              <span class="badge ${p.group==='Forward'?'badge-fwd':'badge-back'}">${p.group}</span>
            </div>
            <div>
              <div style="display:flex;align-items:center;gap:5px;margin-bottom:4px">
                <span style="width:22px;font-size:10px;font-weight:600;color:#636366;flex-shrink:0">Fri</span>
                <span style="display:flex;gap:4px;align-items:center">${friDots}</span>
              </div>
              <div style="display:flex;align-items:center;gap:5px">
                <span style="width:22px;font-size:10px;font-weight:600;color:#636366;flex-shrink:0">Sun</span>
                <span style="display:flex;gap:4px;align-items:center">${sunDots}</span>
              </div>
            </div>
          </div>
          <div style="flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px;padding-top:2px">
            ${posPills}

function buildTeam(){

  function optionHtml(pl, p, isSub, assigned, suffix){
    const taken=assignedNames.includes(pl.name)&&assigned!==pl.name;
    const isPref=!isSub&&pl.prefXplorer.includes(p.label);
    const isAlt=!isSub&&pl.altXplorer.includes(p.label);
    return `<option value="${pl.name}" ${assigned===pl.name?'selected':''} ${taken?'disabled':''}>${pl.jersey??'—'} ${pl.name}${suffix||''}${isPref?' ★':isAlt?' ◆':''}</option>`;
  }

  function slotHtml(p){
    const assigned=t.teamSlots[p.num]; const isSub=p.label.startsWith('Sub');
    return `
      <div class="team-slot ${isSub?'bench':''}">
        ${assigned?`<button class="slot-clear" data-clear="${p.num}" title="Clear this position">×</button>`:''}

            <optgroup label="Available">

            ${others.length?`<optgroup label="No response / unavailable">
              ${others.map(pl=>{
                const suffix=t.pollResults[pl.name]==="Sorry, can't make it"?' (out)':' (no reply)';
                return optionHtml(pl,p,isSub,assigned,suffix);
              }).join('')}
            </optgroup>`:''}

  return `
    <div style="margin-bottom:12px">
      <div style="font-size:12px;color:#8e8e93;margin-bottom:4px">Round — ${TEAMS[state.team].label}</div>

      ${[['positions','Positions'],['dragdrop','List D&amp;D'],['fielddrop','Field D&amp;D'],['field','Field']].map(([v,lbl])=>`
        <button class="btn btn-sm view-toggle ${state.teamView===v?'active':''}" data-view="${v}" style="flex:1;border:none;border-radius:8px;padding:7px 4px;font-size:11px;background:${state.teamView===v?'#fff':'transparent'};color:${state.teamView===v?'#007aff':'#8e8e93'};font-weight:${state.teamView===v?'600':'400'};box-shadow:${state.teamView===v?'0 1px 4px rgba(0,0,0,0.12)':'none'}">${lbl}</button>`).join('')}

      <div class="section-label">Available (${available.length}) — ${TEAMS[state.team].label}</div>
      ${available.length===0?'<div class="notice">No players available yet — enter poll responses first.</div>':
        `<div style="display:flex;flex-wrap:wrap;">${available.map(p=>{
          const a=assignedNames.includes(p.name);

function buildField() {

  // Position layout: x=% left-right, y=% top-bottom
  // Props at TOP, fullback/wings at BOTTOM
  // U10/U11 (12 players): no flankers/fullback
  // U12 (15 players): full layout
  const posLayout_u11 = {
    'Loosehead Prop':   { x:22, y:14 },
    'Hooker':           { x:50, y:14 },
    'Tight Head Prop':  { x:78, y:14 },

    'Left Centre':      { x:27, y:74 },
    'Right Centre':     { x:73, y:74 },
    'Left Wing':        { x:8,  y:86 },
    'Right Wing':       { x:92, y:86 },
  };

  const posLayout_u12 = {
    'Loosehead Prop':   { x:22, y:12 },
    'Hooker':           { x:50, y:12 },
    'Tight Head Prop':  { x:78, y:12 },
    'Left Lock':        { x:36, y:23 },

    'Number Eight':     { x:50, y:32 },
    'Scrum Half':       { x:43, y:45 },
    'Fly Half':         { x:60, y:55 },
    'Left Centre':      { x:25, y:66 },
    'Right Centre':     { x:75, y:66 },
    'Left Wing':        { x:8,  y:77 },
    'Right Wing':       { x:92, y:77 },
    'Fullback':         { x:50, y:87 },
  };

  const posLayout = (grade === 'u12') ? posLayout_u12 : posLayout_u11;

  const fwdPositions = ['Loosehead Prop','Hooker','Tight Head Prop','Left Lock','Right Lock',
    'Blindside Flanker','Openside Flanker','Number Eight'];
  const isForward = pos => fwdPositions.includes(pos);

  function abbrevPos(p) {
    return p.replace('Loosehead Prop','LH Prop')
            .replace('Tight Head Prop','TH Prop')
            .replace('Blindside Flanker','BS Flanker')
            .replace('Openside Flanker','OS Flanker')
            .replace('Number Eight','No. 8')
            .replace('Scrum Half','Scrum Half')
            .replace('Fly Half','Fly Half')
            .replace('Left Centre','L Centre')
            .replace('Right Centre','R Centre')
            .replace('Left Wing','L Wing')
            .replace('Right Wing','R Wing');
  }

  function playerToken(posLabel, slotNum) {
    // Show whoever is actually selected in this slot (incl. no-response players who turned up)
    const name = t.teamSlots[slotNum] || '';
    const player = sq.find(p => p.name === name);
    const jersey = player ? (player.jersey ?? '?') : '';
    const coords = posLayout[posLabel] || { x:50, y:50 };
    const fwd = isForward(posLabel);
    const bg = fwd ? '#1a1a1a' : '#ffffff';
    const fg = fwd ? '#ffffff' : '#1a1a1a';
    const border = fwd ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.15)';
    const nameParts = name ? name.split(' ') : [];
    const firstName = nameParts[0] || '';
    const lastName = nameParts.slice(1).join(' ') || '';

    return `<div class="fp-token" style="left:${coords.x}%;top:${coords.y}%" title="${posLabel}${name?' — '+name:''}">

  // Subs row — use positions() so slot numbers are guaranteed identical to positions view

    const name = t.teamSlots[s.num] || '';

    const nameParts = name ? name.split(' ') : [];
    const firstName = nameParts[0] || '';
    const lastName = nameParts.slice(1).join(' ') || '';
    // Determine if forward or back based on their preferred positions
    const fwd = player && player.prefXplorer.some(p => fwdPositions.includes(p));
    const bg = fwd ? '#1a1a1a' : '#ffffff';
    const fg = fwd ? '#ffffff' : '#1a1a1a';

      .fp-ppos { font-size:9.5px; text-shadow:0 1px 3px rgba(0,0,0,0.9); margin-top:2px; }
      .fp-subs-row { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; padding:12px 8px 14px;
        border-top:1px solid rgba(255,255,255,0.15); background:rgba(0,0,0,0.2); }
      .fp-subs-label { width:100%; text-align:center; font-size:11px; font-weight:600; color:rgba(255,255,255,0.5);
        letter-spacing:0.1em; text-transform:uppercase; margin-bottom:4px; }

    </style>

    ${unassigned > 0 ? `<div class="fp-warn">⚠️ ${unassigned} position${unassigned>1?'s':''} unassigned — fill in the Positions view first.</div>` : ''}

function calcStats(player) {
  // ── Training ─────────────────────────────────────────────────────────────
  // Use sheet data if available, else fall back to static tr[] array
  const sheetDates = Object.keys(liveTrainingData).sort();
  const hasSheetTr = sheetDates.some(d => liveTrainingData[d]?.records?.[player.name] !== undefined);

  let totalSessions, attended, last4Pct;
  if (hasSheetTr) {
    const validDates = sheetDates.filter(d => {
      const v = liveTrainingData[d]?.records?.[player.name];
      return v !== undefined && v !== '' && v !== null;
    });
    totalSessions = validDates.length;
    attended      = validDates.filter(d => liveTrainingData[d].records[player.name] === 'yes').length;
    const last4   = validDates.slice(-4);
    const l4att   = last4.filter(d => liveTrainingData[d].records[player.name] === 'yes').length;
    last4Pct      = last4.length > 0 ? Math.round(l4att / last4.length * 100) : null;
  } else {
    const tr      = player.tr || [];
    totalSessions = tr.filter(v => v !== '').length;
    attended      = tr.filter(v => v === 'Yes').length;
    const last4   = tr.filter(v => v !== '').slice(-4);
    const l4att   = last4.filter(v => v === 'Yes').length;
    last4Pct      = last4.length > 0 ? Math.round(l4att / last4.length * 100) : null;
  }

  // ── Games played: static rounds 1–4 + live rounds 5+ ─────────────────────
  const friS = player.friS || [];
  const sunS = player.sunS || [];

  let friStarted = friS.filter(v => v === 'Started').length;
  let friSub     = friS.filter(v => v === 'Sub').length;
  let friPlayed  = friStarted + friSub;
  let friOut     = friS.filter(v => v === 'Unavailable').length;
  let friNS      = friS.filter(v => v === 'Not Selected').length;

  // Add rounds 5+ from live sheet data (skip washout rounds)
  Object.entries(liveSquadHistory.fri).forEach(([round, roundData]) => {
    const fix = FIXTURES.seahorses.find(f => f.round === +round);
    if (fix?.result === 'Washout') return; // don't count washouts
    const s = roundData[player.name] || '';
    if (s === 'Started')         { friStarted++; friPlayed++; }
    else if (s === 'Sub')        { friSub++;     friPlayed++; }
    else if (s === 'Unavailable') friOut++;
    else if (s === 'Not Selected') friNS++;
  });

  let sunStarted = sunS.filter(v => v === 'Started').length;
  let sunSub     = sunS.filter(v => v === 'Sub').length;
  let sunPlayed  = sunStarted + sunSub;
  let sunOut     = sunS.filter(v => v === 'Unavailable').length;
  let sunNS      = sunS.filter(v => v === 'Not Selected').length;

  Object.entries(liveSquadHistory.sun).forEach(([round, roundData]) => {
    const fix = FIXTURES.barbarians.find(f => f.round === +round);
    if (fix?.result === 'Washout') return;
    const s = roundData[player.name] || '';
    if (s === 'Started')          { sunStarted++; sunPlayed++; }
    else if (s === 'Sub')         { sunSub++;     sunPlayed++; }
    else if (s === 'Unavailable')  sunOut++;
    else if (s === 'Not Selected') sunNS++;
  });

  const last4Total = hasSheetTr
    ? Object.keys(liveTrainingData).filter(d => liveTrainingData[d]?.records?.[player.name] !== undefined && liveTrainingData[d]?.records?.[player.name] !== '').length >= 4 ? 4 : Object.keys(liveTrainingData).filter(d => liveTrainingData[d]?.records?.[player.name] !== undefined && liveTrainingData[d]?.records?.[player.name] !== '').length
    : (player.tr||[]).filter(v=>v!=='').slice(-4).length;

  return { attended, totalSessions, last4Pct, last4Total,
           friStarted, friSub, friPlayed, friOut, friNS,
           sunStarted, sunSub, sunPlayed, sunOut, sunNS };
}

function autoFill(){
  const sq=squad(); const pos=positions(); const t=td();
  const available=sq.filter(p=>t.pollResults[p.name]==='Yes, count me in'||t.pollResults[p.name]==='Help! I need a ride, please');
  const newSlots={}; const used=new Set();
  pos.filter(p=>!p.label.startsWith('Sub')).forEach(pos=>{
    const pref=available.filter(p=>!used.has(p.name)&&p.prefXplorer.includes(pos.label));
    const alt =available.filter(p=>!used.has(p.name)&&p.altXplorer.includes(pos.label));
    const pick=pref[0]||alt[0];
    if(pick){newSlots[pos.num]=pick.name;used.add(pick.name);}
  });
  pos.filter(p=>p.label.startsWith('Sub')).forEach(pos=>{
    const rem=available.filter(p=>!used.has(p.name));
    if(rem[0]){newSlots[pos.num]=rem[0].name;used.add(rem[0].name);}
  });
  t.teamSlots=newSlots; storageSave(); render();
}

// ── Drag & drop interaction (touch + mouse) ──────────────────────────────────
function ddAssign(name, toSlot){
  const t=td();
  for(const k of Object.keys(t.teamSlots)){ if(t.teamSlots[k]===name) delete t.teamSlots[k]; } // remove from any current slot
  if(toSlot!=null) t.teamSlots[toSlot]=name; // bumps any previous occupant back to the pool
  saveTeamSlots(); render();
}
function ddUnassign(name){
  const t=td();
  for(const k of Object.keys(t.teamSlots)){ if(t.teamSlots[k]===name) delete t.teamSlots[k]; }
  saveTeamSlots(); render();
}
function initDragDrop(){
  const root=document.getElementById('dd-wrap');
  if(!root) return;
  let selected=null;   // tap-to-place selection
  let drag=null;       // active drag
  let scrollRaf=null;  // requestAnimationFrame handle for auto-scroll
  const SCROLL_ZONE=100; // px from edge that triggers scroll
  const SCROLL_MAX=18;   // max px per frame

  function autoScroll(clientY){
    cancelAnimationFrame(scrollRaf);
    const vh=window.innerHeight;
    let speed=0;
    if(clientY > vh-SCROLL_ZONE) speed = Math.round(SCROLL_MAX*(clientY-(vh-SCROLL_ZONE))/SCROLL_ZONE);
    else if(clientY < SCROLL_ZONE) speed = -Math.round(SCROLL_MAX*(SCROLL_ZONE-clientY)/SCROLL_ZONE);
    if(speed===0) return;
    function step(){ window.scrollBy(0,speed); scrollRaf=requestAnimationFrame(step); }
    scrollRaf=requestAnimationFrame(step);
  }

  function clearSel(){ selected=null; document.querySelectorAll('.dd-chip.sel').forEach(c=>c.classList.remove('sel')); }
  function targetAt(x,y){ const el=document.elementFromPoint(x,y); return el?el.closest('.dd-slot, [data-pool]'):null; }
  function clearOver(){ document.querySelectorAll('.dd-slot.over, [data-pool].over').forEach(s=>s.classList.remove('over')); }

  root.addEventListener('pointerdown', e=>{
    const chip=e.target.closest('.dd-chip');
    if(chip){
      e.preventDefault();
      drag={ name:chip.dataset.player, moved:false, x0:e.clientX, y0:e.clientY, ghost:null, chip };
      try{ root.setPointerCapture(e.pointerId); }catch(_){}
      return;
    }
    // Tap an empty slot or the pool to place / remove the selected player
    if(selected){
      const slot=e.target.closest('.dd-slot');
      if(slot){ ddAssign(selected, +slot.dataset.slot); clearSel(); return; }
      if(e.target.closest('[data-pool]')){ ddUnassign(selected); clearSel(); return; }
    }
  });
  root.addEventListener('pointermove', e=>{
    if(!drag) return;
    const dx=e.clientX-drag.x0, dy=e.clientY-drag.y0;
    if(!drag.moved && Math.hypot(dx,dy)>6){
      drag.moved=true;
      drag.chip.classList.add('dragging');
      drag.ghost=document.createElement('div'); drag.ghost.className='dd-ghost'; drag.ghost.textContent=drag.name;
      document.body.appendChild(drag.ghost);
    }
    if(drag.moved){
      drag.ghost.style.left=e.clientX+'px'; drag.ghost.style.top=e.clientY+'px';
      autoScroll(e.clientY);
      clearOver();
      const tgt=targetAt(e.clientX,e.clientY); if(tgt) tgt.classList.add('over');
    }
  });
  root.addEventListener('pointerup', e=>{
    if(!drag) return;
    const d=drag; drag=null;
    cancelAnimationFrame(scrollRaf);
    if(d.ghost) d.ghost.remove();
    d.chip.classList.remove('dragging');
    clearOver();
    if(d.moved){
      const tgt=targetAt(e.clientX,e.clientY);
      if(tgt && tgt.classList.contains('dd-slot')) ddAssign(d.name, +tgt.dataset.slot);
      else if(tgt && tgt.hasAttribute('data-pool')) ddUnassign(d.name);
    } else {
      // Tap (no drag) → toggle selection for tap-to-place
      if(selected===d.name){ clearSel(); }
      else { clearSel(); selected=d.name; d.chip.classList.add('sel'); }
    }
  });
  root.addEventListener('pointercancel', ()=>{
    cancelAnimationFrame(scrollRaf);
    if(drag){ if(drag.ghost) drag.ghost.remove(); drag.chip.classList.remove('dragging'); drag=null; clearOver(); }
  });
}

function initFieldDrop() {
  const wrap = document.getElementById('fd-wrap');
  const pool = document.getElementById('fd-pool');
  if (!wrap || !pool) return;

  let selected = null;
  let drag     = null;
  let scrollRaf = null;
  const SCROLL_ZONE = 100, SCROLL_MAX = 18;

  function autoScroll(clientY) {
    cancelAnimationFrame(scrollRaf);
    const vh = window.innerHeight;
    let speed = 0;
    if (clientY > vh - SCROLL_ZONE) speed =  Math.round(SCROLL_MAX*(clientY-(vh-SCROLL_ZONE))/SCROLL_ZONE);
    else if (clientY < SCROLL_ZONE)  speed = -Math.round(SCROLL_MAX*(SCROLL_ZONE-clientY)/SCROLL_ZONE);
    if (!speed) return;
    function step(){ window.scrollBy(0,speed); scrollRaf=requestAnimationFrame(step); }
    scrollRaf = requestAnimationFrame(step);
  }

  function clearSel() {
    selected = null;
    document.querySelectorAll('.fd-chip.sel').forEach(c=>c.classList.remove('sel'));
  }
  function clearOver() {
    document.querySelectorAll('.fd-token.fd-over').forEach(t=>t.classList.remove('fd-over'));
  }
  function tokenAt(x, y) {
    const ghost = document.querySelector('.dd-ghost');
    if (ghost) ghost.style.display = 'none';
    const el = document.elementFromPoint(x, y);
    if (ghost) ghost.style.display = '';
    return el ? el.closest('.fd-token[data-slot]') : null;
  }

  // ── Drag & tap-select from pool bar ─────────────────────────────────────────
  pool.addEventListener('pointerdown', e => {
    const chip = e.target.closest('.fd-chip');
    if (!chip) return;
    e.preventDefault();
    drag = { name:chip.dataset.player, moved:false, x0:e.clientX, y0:e.clientY, ghost:null, chip };
    try { pool.setPointerCapture(e.pointerId); } catch(_) {}
  });
  pool.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx=e.clientX-drag.x0, dy=e.clientY-drag.y0;
    if (!drag.moved && Math.hypot(dx,dy)>6) {
      drag.moved = true;
      drag.chip.classList.add('dragging');
      drag.ghost = document.createElement('div');
      drag.ghost.className = 'dd-ghost';
      drag.ghost.textContent = drag.name;
      document.body.appendChild(drag.ghost);
    }
    if (drag.moved) {
      drag.ghost.style.left = e.clientX+'px';
      drag.ghost.style.top  = e.clientY+'px';
      autoScroll(e.clientY);
      clearOver();
      const tgt = tokenAt(e.clientX, e.clientY);
      if (tgt) tgt.classList.add('fd-over');
    }
  });
  pool.addEventListener('pointerup', e => {
    if (!drag) return;
    const d = drag; drag = null;
    cancelAnimationFrame(scrollRaf);
    if (d.ghost) d.ghost.remove();
    d.chip.classList.remove('dragging');
    clearOver();
    if (d.moved) {
      const tgt = tokenAt(e.clientX, e.clientY);
      if (tgt) { ddAssign(d.name, +tgt.dataset.slot); clearSel(); }
    } else {
      if (selected === d.name) { clearSel(); }
      else { clearSel(); selected = d.name; d.chip.classList.add('sel'); }
    }
  });
  pool.addEventListener('pointercancel', () => {
    cancelAnimationFrame(scrollRaf);
    if (drag) { if (drag.ghost) drag.ghost.remove(); drag.chip.classList.remove('dragging'); drag=null; }
    clearOver();
  });

  // ── Tap position tokens to assign (if chip selected) or clear ───────────────
  wrap.addEventListener('click', e => {
    const token = e.target.closest('.fd-token[data-slot]');
    if (!token) return;
    const slotNum = +token.dataset.slot;
    if (selected) {
      ddAssign(selected, slotNum);
      clearSel();
    } else {
      const cur = td().teamSlots[slotNum];
      if (cur) ddUnassign(cur);
    }
  });
}

function attachEvents(){
  document.querySelectorAll('.section-btn').forEach(b=>b.addEventListener('click',()=>{
    state.section=b.dataset.section;
    // Set sensible default tab when switching sections
    if(state.section==='availability' && !['poll','team','export'].includes(state.tab)) state.tab='poll';
    if(state.section==='squad' && !['squad','stats'].includes(state.tab)) state.tab='squad';
    render();
  }));
  document.querySelectorAll('.tab').forEach(el=>el.addEventListener('click',()=>{state.tab=el.dataset.tab;render();}));
  document.querySelectorAll('[data-team]').forEach(b=>b.addEventListener('click',()=>{
    if(state.team!==b.dataset.team){state.team=b.dataset.team;storageSave();render();showToast('Switched to '+TEAMS[b.dataset.team].label);}
  }));
  document.querySelectorAll('[data-grade]').forEach(b=>b.addEventListener('click',()=>{
    const t=td();
    if(t.grade!==b.dataset.grade){t.grade=b.dataset.grade;t.teamSlots={};storageSave();render();showToast('Switched to '+AGE_GRADES[b.dataset.grade].label);}
  }));
  const syncBtn=document.getElementById('sync-now');
  if(syncBtn) syncBtn.addEventListener('click', async ()=>{
    syncBtn.textContent='Syncing…';
    const r = await syncResponsesFromSheet();
    const t = await loadTeamFromSheet();
    if(r||t){ savedState=toCode(); render(); showToast('Synced ✓'); }
    else { showToast(APPS_SCRIPT_URL==='YOUR_APPS_SCRIPT_URL_HERE'?'Add Apps Script URL first':'No new data'); }
    if(syncBtn) syncBtn.textContent='↻ Sync';
  });
  const sn=document.getElementById('save-now');
  if(sn) sn.addEventListener('click',()=>{storageSave();showToast('Saved!');render();});
  const sc=document.getElementById('show-code');
  if(sc) sc.addEventListener('click',()=>{state.tab='export';render();setTimeout(()=>document.getElementById('export-code')?.scrollIntoView({behavior:'smooth'}),100);});
  if(state.tab==='poll'){
    const roundSel=document.getElementById('m-round');
    if(roundSel) roundSel.addEventListener('change',async ()=>{
      const t=td();
      const val=roundSel.value;
      if(val==='custom'||val==='') {
        t.round=val||null;
        storageSave(); render(); return;
      }
      const rnd=parseInt(val);
      t.round=rnd;
      const fixture=(FIXTURES[state.team]||[]).find(f=>f.round===rnd);
      if(fixture){
        t.match={opponent:fixture.opponent,date:fixture.date,venue:fixture.venue,time:fixture.time};
      }
      // Re-sync this round's real data from the sheet so any round can be reviewed/corrected
      t.pollResults={}; t.teamSlots={};
      storageSave(); render();
      showToast('Loading Round '+rnd+'…');
      const r = await syncResponsesFromSheet();
      const tm = await loadTeamFromSheet();
      savedState=toCode(); render();
      showToast(r||tm ? 'Round '+rnd+' loaded ✓' : 'Round '+rnd+' — no saved data');
    });
    ['opponent','date','venue','time'].forEach(f=>{
      const el=document.getElementById('m-'+f);
      if(el) el.addEventListener('input',()=>{td().match[f]=el.value;storageSave();});
    });
    document.querySelectorAll('[data-poll]').forEach(sel=>{
      sel.addEventListener('change',()=>{
        const t=td();
        const player=sel.dataset.poll;
        if(sel.value) t.pollResults[player]=sel.value;
        else delete t.pollResults[player];
        storageSave(); render();
        // Push manual entry to sheet so it persists and syncs across devices
        if(sel.value && t.round) {
          apiPost({
            action:'submitResponse',
            round: t.round,
            team: TEAMS[state.team].label,
            playerName: player,
            availability: sel.value,
            needsRide: false,
            notes: 'Manual entry'
          });
        }
      });
    });
    const gt=document.getElementById('go-team');
    if(gt) gt.addEventListener('click',()=>{state.tab='team';render();});
  }
  if(state.tab==='team'){
    const teamRoundSel=document.getElementById('team-round');
    if(teamRoundSel) teamRoundSel.addEventListener('change',async ()=>{
      const t=td();
      const val=teamRoundSel.value;
      if(val==='custom'){ t.round='custom'; storageSave(); render(); return; }
      const rnd=parseInt(val);
      t.round=rnd;
      const fixture=(FIXTURES[state.team]||[]).find(f=>f.round===rnd);
      if(fixture){ t.match={opponent:fixture.opponent,date:fixture.date,venue:fixture.venue,time:fixture.time}; }
      t.pollResults={}; t.teamSlots={};
      storageSave(); render();
      showToast('Loading Round '+rnd+'…');
      const r=await syncResponsesFromSheet();
      const tm=await loadTeamFromSheet();
      savedState=toCode(); render();
      showToast(r||tm ? 'Round '+rnd+' loaded ✓' : 'Round '+rnd+' — no saved data');
    });
    document.querySelectorAll('.view-toggle').forEach(b=>b.addEventListener('click',()=>{
      state.teamView=b.dataset.view; render();
    }));
    document.querySelectorAll('[data-slot]').forEach(sel=>{
      sel.addEventListener('change',()=>{
        const t=td();
        if(sel.value) t.teamSlots[+sel.dataset.slot]=sel.value;
        else delete t.teamSlots[+sel.dataset.slot];
        saveTeamSlots(); render();
      });
    });
    document.querySelectorAll('[data-clear]').forEach(b=>b.addEventListener('click',()=>{
      delete td().teamSlots[+b.dataset.clear];
      saveTeamSlots(); render();
    }));
    if(state.teamView==='dragdrop') initDragDrop();
    if(state.teamView==='fielddrop') initFieldDrop();
    const af=document.getElementById('auto-fill');
    if(af) af.addEventListener('click',autoFill);
    const ct=document.getElementById('clear-team');
    if(ct) ct.addEventListener('click',()=>{td().teamSlots={};saveTeamSlots();render();});

    const copyFieldBtn = document.getElementById('copy-field-btn');
    if(copyFieldBtn) copyFieldBtn.addEventListener('click', async () => {
      const wrap = document.getElementById('fp-wrap-el');
      if(!wrap || typeof html2canvas === 'undefined') { showToast('Screenshot not available'); return; }
      copyFieldBtn.textContent = '⏳ Generating image…';
      copyFieldBtn.disabled = true;
      try {
        const canvas = await html2canvas(wrap, {
          scale: 3,
          useCORS: true,
          allowTaint: true,
          backgroundColor: null,
          logging: false
        });
        canvas.toBlob(async blob => {
          try {
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
            copyFieldBtn.textContent = '✅ Copied! Paste into WhatsApp';
            setTimeout(() => { copyFieldBtn.textContent = '📸 Copy field view for WhatsApp'; copyFieldBtn.disabled = false; }, 3000);
          } catch(clipErr) {
            // Clipboard API failed — fall back to download
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'field-view.png'; a.click();
            URL.revokeObjectURL(url);
            copyFieldBtn.textContent = '📸 Copy field view for WhatsApp';
            copyFieldBtn.disabled = false;
          }
        }, 'image/png');
      } catch(e) {
        showToast('Could not generate image');
        copyFieldBtn.textContent = '📸 Copy field view for WhatsApp';
        copyFieldBtn.disabled = false;
      }
    });
  }
  if(state.tab==='stats'){
    const stBtn=document.getElementById('stats-table-btn');
    if(stBtn) stBtn.addEventListener('click',()=>{state.statsView='table';render();});
    const sgBtn=document.getElementById('stats-graphic-btn');
    if(sgBtn) sgBtn.addEventListener('click',()=>{state.statsView='graphic';render();});
    const cgBtn=document.getElementById('copy-graphic');
    if(cgBtn) cgBtn.addEventListener('click',()=>{
      const txt=document.getElementById('graphic-content')?.textContent||'';
      navigator.clipboard.writeText(txt).then(()=>{cgBtn.textContent='Copied!';setTimeout(()=>cgBtn.textContent='Copy for WhatsApp',2000);});
    });
  }
  if(state.tab==='export'){
    const cp=document.getElementById('copy-sheet');
    if(cp) cp.addEventListener('click',()=>{
      const t=td();
      const text=positions().map(p=>{const name=t.teamSlots[p.num]||'(unassigned)';const pl=squad().find(s=>s.name===name);return `${String(p.num).padStart(2)}  ${p.label.padEnd(20)}${name}${pl&&pl.jersey?' #'+pl.jersey:''}`;}).join('\n');
      navigator.clipboard.writeText(text).then(()=>showToast('Team sheet copied!'));
    });
    const cc=document.getElementById('copy-code');
    if(cc) cc.addEventListener('click',()=>{navigator.clipboard.writeText(document.getElementById('export-code')?.value||'').then(()=>showToast('Save code copied!'));});
    const rb=document.getElementById('restore-btn');
    if(rb) rb.addEventListener('click',()=>{const code=document.getElementById('import-code')?.value||'';if(fromCode(code)){storageSave();showToast('Restored!');render();}else showToast('Invalid code — please check and try again');});
  }
}

storageLoad();

// Auto-advance round when the stored round's game date has passed
['seahorses','barbarians'].forEach(team => {
  const t = state.teams[team];
  if (!t.round || t.round === 'custom') return;
  const storedFixture = (FIXTURES[team]||[]).find(f => f.round === t.round);
  if (!storedFixture) return;
  const gameDate = new Date(storedFixture.isoDate);
  const today = new Date(); today.setHours(0,0,0,0);
  if (gameDate < today) {
    const nextRound = nextRoundForTeam(team);
    if (nextRound && nextRound !== t.round) {
      const nextFixture = (FIXTURES[team]||[]).find(f => f.round === nextRound);
      if (nextFixture) {
        t.round = nextRound;
        t.match = {opponent:nextFixture.opponent, date:nextFixture.date, venue:nextFixture.venue, time:nextFixture.time};
        t.pollResults = {};
        t.teamSlots = {};
      }
    }
  }
});

// Inject R5 poll results and team if seahorses has no saved data yet
// Pre-populate Round 3 availability from spreadsheet
const R5_POLL = {"Rafferty Moffitt": "Yes, count me in", "William English": "Yes, count me in", "Jackson Kendall": "Yes, count me in", "Patrick Keenen": "Yes, count me in", "Xavier Reddy": "Yes, count me in", "Michael Dunworth": "Yes, count me in", "Thomas Morgan": "Yes, count me in", "Henry Scott": "Yes, count me in", "Edward Macassey": "Yes, count me in", "Lachlan McDonald": "Yes, count me in", "Max Boss": "Yes, count me in", "Nathan Evans": "Yes, count me in", "Beau Hack": "Yes, count me in", "Teddy Russell": "Yes, count me in", "Kycen Puroku": "Yes, count me in", "Freddie Kirrane": "Yes, count me in", "Aidan Schulz": "Yes, count me in", "Kai Lianto": "Yes, count me in", "Theo Deichsel": "Yes, count me in", "Archer Price": "Yes, count me in", "Sasha Hayim": "Yes, count me in", "Watene Falemanu": "Yes, count me in", "Elliot Dean": "Yes, count me in", "Xavier Saunders": "Sorry, can't make it"};
const R5_TEAM = {"1": "Watene Falemanu", "2": "Teddy Russell", "3": "Theo Deichsel", "4": "William English", "5": "Michael Dunworth", "6": "Lachlan McDonald", "7": "Nathan Evans", "8": "Max Boss", "9": "Thomas Morgan", "10": "Beau Hack", "11": "Kycen Puroku", "12": "Freddie Kirrane", "13": "Kai Lianto", "14": "Patrick Keenen", "15": "Jackson Kendall", "16": "Xavier Reddy", "17": "Edward Macassey", "18": "Archer Price"};

// Inject R5 poll results and team if seahorses hasn't been saved yet (fresh load)
if(Object.keys(state.teams.seahorses.pollResults).length === 0 && state.teams.seahorses.round === 5) {
  state.teams.seahorses.pollResults = {...R5_POLL};
  state.teams.seahorses.teamSlots = {...R5_TEAM};
}

savedState=toCode();
render();

// After initial render, sync responses and team from sheet in background
(async () => {
  loadResults(); // live match results for the round selectors
  const responsesChanged = await syncResponsesFromSheet();
  const teamChanged = await loadTeamFromSheet();
  if (responsesChanged || teamChanged) {
    savedState = toCode();
    render();
    showToast('Synced with shared data ✓');
  }
})();
</script>
